<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Recrutement micro-crèches</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700&display=swap" rel="stylesheet">
<style>
/* VOICE  outil de travail d'un gestionnaire de crèches : calme, chaleureux, précis
   IDEA   le tableau aimanté de l'équipe : chaque crèche est une maison à 4 places, chaque candidat un aimant qui avance sur 8 étapes
   PICTURE les 2 maisons dont les places se remplissent avec les recrues, puis l'entonnoir en 3D
   COLOUR fond blanc, bandeau pétrole profond, couleurs de poste violet / turquoise / abricot, framboise pour les alertes
   TYPE   Nunito 800 pour les titres + Nunito Sans pour le texte
   LAYOUT bandeau + onglets ; tableau de bord : constat en titre, maisons à gauche, chiffres à droite, graphiques en 2-3 colonnes ; téléphone : empilé */
:root{color-scheme:light dark;
--bg:light-dark(#ffffff,#0f1419);--ink:light-dark(#17212b,#e8edf2);--mut:light-dark(#56626f,#9fabb8);
--pan:light-dark(#f1f6f7,#17202a);--pan2:light-dark(#e4eef0,#1f2b36);--line:light-dark(#d9e2e6,#2c3946);
--brand:light-dark(#0d4a5e,#0a3442);--pri:light-dark(#0d4a5e,#5cc0db);--onpri:light-dark(#ffffff,#07222c);
--eje:#7a5af8;--ap:#0f9f9c;--cap:#ee8434;
--alert:light-dark(#c9304a,#ff7a8f);--ok:light-dark(#18804a,#55d692);--warn:light-dark(#a86200,#ffc163);
--okbg:light-dark(#e3f4ea,#15301f);--warnbg:light-dark(#fff1d9,#382a12);--nobg:light-dark(#fde5ea,#3a1820)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.5 "Nunito Sans",system-ui,sans-serif;overflow-x:clip}
h1,h2,h3{font-family:Nunito,system-ui,sans-serif;letter-spacing:-.02em;line-height:1.1;margin:0}
h2{font-size:clamp(26px,3.2vw,38px);font-weight:900;text-wrap:balance}
h3{font-size:19px;font-weight:800;margin-bottom:10px}
button,input,select,textarea{font:inherit;color:inherit}
.top{background:var(--brand);color:#fff;padding:18px max(4vw,16px) 0}
.top .row{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;justify-content:space-between;max-width:1240px;margin:auto}
.top h1{font-size:clamp(22px,2.6vw,30px);font-weight:900}
.top h1 small{display:block;font:600 14px "Nunito Sans",sans-serif;opacity:.8;letter-spacing:0;margin-top:4px}
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sync{font-size:13px;padding:5px 10px;border-radius:99px;background:rgba(255,255,255,.14);white-space:nowrap}
#fCreche option{color:#17212b;background:#fff}
.btn[disabled]{opacity:.4;cursor:default}
.tabs{display:flex;gap:4px;overflow-x:auto;max-width:1240px;margin:14px auto 0;scrollbar-width:none}
.tabs a{flex:none;color:#fff;opacity:.75;text-decoration:none;font-weight:700;padding:10px 14px;border-radius:10px 10px 0 0;white-space:nowrap}
.tabs a[aria-current]{opacity:1;background:var(--bg);color:var(--ink)}
.wrap{max-width:1240px;margin:auto;padding:22px max(4vw,16px) 60px}
.btn{min-height:44px;padding:0 16px;border-radius:10px;border:1px solid var(--line);background:var(--bg);cursor:pointer;font-weight:700;display:inline-flex;align-items:center;gap:6px;justify-content:center}
.btn:hover{border-color:var(--pri)}
.btn.pri{background:var(--pri);color:var(--onpri);border-color:var(--pri)}
.btn.lite{background:rgba(255,255,255,.16);color:#fff;border-color:rgba(255,255,255,.3)}
.btn.sm{min-height:36px;padding:0 10px;font-size:14px}
.btn.dang{color:var(--alert);border-color:var(--alert)}
:focus-visible{outline:3px solid var(--pri);outline-offset:2px}
input,select,textarea{font-size:16px;min-height:44px;border:1px solid var(--line);border-radius:10px;background:var(--bg);padding:8px 10px;width:100%}
textarea{min-height:76px;resize:vertical}
label{display:block;font-size:14px;font-weight:700;color:var(--mut)}
label>input,label>select,label>textarea{margin-top:4px;color:var(--ink);font-weight:400}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.panel{background:var(--pan);border-radius:16px;padding:18px}
.mut{color:var(--mut)}.small{font-size:14px}
.head{display:flex;flex-wrap:wrap;gap:12px;align-items:end;justify-content:space-between;margin-bottom:18px}
.seg{display:inline-flex;background:var(--pan);border-radius:12px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:none;min-height:38px;padding:0 12px;border-radius:9px;cursor:pointer;font-weight:700;color:var(--mut)}
.seg button[aria-pressed=true]{background:var(--bg);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.chip{display:inline-block;font-size:13px;font-weight:800;padding:2px 9px;border-radius:99px;color:#fff;white-space:nowrap}
.eje{background:var(--eje)}.ap{background:var(--ap)}.cap{background:var(--cap)}
.pill{display:inline-block;font-size:13px;font-weight:800;padding:2px 9px;border-radius:99px;white-space:nowrap}
.v-go{background:var(--okbg);color:var(--ok)}.v-app{background:var(--warnbg);color:var(--warn)}.v-no,.v-veto{background:var(--nobg);color:var(--alert)}
.al{color:var(--alert);font-weight:700;font-size:14px}
.note{background:var(--warnbg);color:var(--ink);border-radius:12px;padding:10px 14px;margin-bottom:16px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;font-size:15px}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.kpi{background:var(--pan);border-radius:14px;padding:12px 14px}
.kpi b{display:block;font:900 clamp(26px,3vw,34px) Nunito,sans-serif;line-height:1.1}
.kpi span{font-size:14px;color:var(--mut)}
.houses{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.house svg{width:100%;height:auto;display:block}
.house .cap2{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;justify-content:center;font-size:14px;margin-top:6px}
.dash1{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:18px;align-items:start}
.fig{position:relative;min-height:290px}.fig>svg{position:absolute;inset:0;width:100%;height:100%}
svg text{font-family:"Nunito Sans",sans-serif;fill:var(--ink)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:14px;margin-top:6px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.rows .r{display:grid;grid-template-columns:minmax(0,9em) minmax(0,1fr) max-content;gap:10px;align-items:center;font-size:14px;margin:7px 0}
.rows .bar{height:14px;border-radius:7px;background:var(--pan2);overflow:hidden;position:relative}
.rows .bar i{position:absolute;inset:0 auto 0 0;border-radius:7px}
.rows .n{text-align:right;font-weight:800;font-variant-numeric:tabular-nums}
.acts{list-style:none;margin:0;padding:0}
.acts li{display:flex;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.acts li button{margin-left:auto}
.mag{flex:none;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:#fff;font:900 14px Nunito,sans-serif;box-shadow:inset 0 -3px 0 rgba(0,0,0,.18)}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:15px}
th{text-align:left;font-size:13px;color:var(--mut);font-weight:800;padding:8px;border-bottom:2px solid var(--line);white-space:nowrap}
td{padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tr.click{cursor:pointer}tr.click:hover td{background:var(--pan)}
.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(250px,1fr);gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:10px}
.col{scroll-snap-align:start;background:var(--pan);border-radius:16px;padding:10px;min-height:340px}
.col.over{outline:3px dashed var(--pri);outline-offset:-3px}
.col h4{margin:2px 4px 6px;font:800 15px Nunito,sans-serif;display:flex;justify-content:space-between;gap:6px}
.col h4 span{color:var(--mut);font-weight:700;font-size:13px}
.card{background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:10px;margin-top:8px;cursor:grab;display:grid;gap:6px}
.card.dim{opacity:.55}
.card .t{display:flex;gap:10px;align-items:center}
.card .t b{display:block;line-height:1.2}
.card .t small{color:var(--mut);font-size:13px}
.card .m{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:14px}
.dots{display:inline-flex;gap:3px;margin-left:auto}.dots i{width:9px;height:9px;border-radius:2px;background:var(--pan2)}.dots i.on{background:var(--ok)}
.mv{display:flex;gap:6px}.mv .btn{flex:1}
.drawer{position:fixed;inset:0;background:rgba(10,20,28,.45);display:none;z-index:20}
.drawer.open{display:block}
.drawer aside{position:absolute;right:0;top:0;bottom:0;width:min(600px,100%);background:var(--bg);overflow-y:auto;padding:20px max(3vw,16px) 0;box-shadow:-8px 0 30px rgba(0,0,0,.2)}
.drawer h3{margin-top:18px}
.drawer .foot{position:sticky;bottom:0;background:var(--bg);padding:14px 0;display:flex;gap:8px;flex-wrap:wrap;border-top:1px solid var(--line);margin-top:18px}
.sbar{position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 0;border-bottom:1px solid var(--line);display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.big{font:900 clamp(40px,5vw,60px) Nunito,sans-serif;line-height:1;color:var(--pri)}
.q{border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin-top:12px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px 18px;align-items:start}
.q .qt{font-weight:700;font-size:17px}
.q .qh{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:6px;font-size:14px;color:var(--mut)}
.q details{grid-column:1/-1;font-size:15px}
.q summary{cursor:pointer;color:var(--pri);font-weight:700;min-height:32px}
.q .exp{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 18px;margin-top:6px}
.q .exp p{margin:2px 0 0}
.q .exp .bad{color:var(--alert)}
.notes{display:flex;gap:6px}
.notes button{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--bg);font:900 18px Nunito,sans-serif;cursor:pointer}
.notes button[aria-pressed=true]{color:#fff;border-color:transparent}
.n1[aria-pressed=true]{background:#d23c4f}.n2[aria-pressed=true]{background:#e8833a}.n3[aria-pressed=true]{background:#c9a400}.n4[aria-pressed=true]{background:#58a84c}.n5[aria-pressed=true]{background:#1d8a4e}
.blk .r{grid-template-columns:minmax(0,11em) minmax(0,1fr) 3.4em}
.cards3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.fiche{border-radius:16px;overflow:hidden;border:1px solid var(--line)}
.fiche>h3{color:#fff;padding:14px 16px;margin:0;font-size:18px}
.fiche dl{margin:0;padding:6px 16px 16px}
.fiche dt{font-size:13px;font-weight:800;color:var(--mut);margin-top:12px}
.fiche dd{margin:2px 0 0;font-size:15px;white-space:pre-line}
.fiche pre{white-space:pre-wrap;font:15px/1.5 "Nunito Sans",sans-serif;background:var(--pan);padding:12px;border-radius:12px;margin:6px 0}
.onb td{text-align:center}
.onb td:first-child,.onb th:first-child{text-align:left}
.onb button{min-height:36px;min-width:92px;border-radius:9px;border:1px solid var(--line);background:var(--bg);cursor:pointer;font-size:14px;font-weight:700}
.onb button.s1{background:var(--okbg);color:var(--ok);border-color:transparent}.onb button.s2{background:var(--warnbg);color:var(--warn);border-color:transparent}.onb button.s3{color:var(--mut);font-style:italic}
.heat{text-align:center;font-weight:800;border-radius:8px}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:700;z-index:40;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw}
.toast.on{opacity:1}
.empty{text-align:center;padding:40px 16px;border:2px dashed var(--line);border-radius:16px}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
@media(max-width:900px){.dash1{grid-template-columns:minmax(0,1fr)}.cards3{grid-template-columns:minmax(0,1fr)}.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:600px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.g2,.g3,.g4{grid-template-columns:minmax(0,1fr)}.q{grid-template-columns:minmax(0,1fr)}.q .exp{grid-template-columns:minmax(0,1fr)}table{font-size:14px}th,td{padding:6px 4px}
.stack thead{display:none}.stack tr{display:grid;padding-block:10px;border-bottom:1px solid var(--line)}.stack td{display:flex;justify-content:space-between;gap:12px;border:0;padding:3px 0}.stack td::before{content:attr(data-l);color:var(--mut);font-size:13px;font-weight:700}.stack td:empty{display:none}}
</style>
</head>
<body>
<header class="top">
  <div class="row">
    <h1>Recrutement des micro-crèches<small id="sub">8 postes · 2 EJE · 2 auxiliaires de puériculture · 4 CAP AEPE</small></h1>
    <div class="tools">
      <span class="sync" id="sync">Connexion…</span>
      <select id="fCreche" aria-label="Filtrer par crèche" style="width:auto;min-width:170px;background:rgba(255,255,255,.14);color:#fff;border-color:rgba(255,255,255,.3)"></select>
      <button class="btn lite" id="newBtn" type="button">+ Candidat</button>
    </div>
  </div>
  <nav class="tabs" id="tabs">
    <a href="#tableau">Tableau de bord</a><a href="#candidats">Candidats</a><a href="#entretien">Entretien</a><a href="#comparer">Comparer</a><a href="#postes">Postes & intégration</a><a href="#ressources">Fiches & questions</a><a href="#reglages">Réglages</a>
  </nav>
</header>
<main class="wrap" id="main"></main>
<div class="drawer" id="drawer"><aside id="dr" aria-label="Fiche candidat"></aside></div>
<div class="toast" id="toast" role="status"></div>
<script>
{
const D = {"BLOCS": [["B1", "Sécurité & santé de l'enfant", "Sécurité", "Oui", "Vigilance, protocoles d'urgence, hygiène, PAI, gestes qui sauvent"], ["B2", "Bientraitance & posture professionnelle", "Bientraitance", "Oui", "Respect de l'enfant, prévention des violences éducatives ordinaires, régulation émotionnelle"], ["B3", "Éveil & développement de l'enfant", "Éveil & dév.", "Non", "Connaissance du développement 0-3 ans, activités, autonomie, observation"], ["B4", "Relation aux familles", "Familles", "Non", "Accueil, transmissions, gestion des désaccords, confidentialité"], ["B5", "Travail en équipe & communication", "Équipe", "Non", "Coopération, gestion de conflit, adaptabilité, (EJE : animation d'équipe)"], ["B6", "Expérience, motivation & adéquation", "Exp. & motiv.", "Non", "Parcours, projet, disponibilités, adéquation micro-crèche"]], "POIDS": {"EJE": [0.15, 0.2, 0.25, 0.15, 0.15, 0.1], "AP": [0.25, 0.2, 0.15, 0.15, 0.15, 0.1], "CAP AEPE": [0.2, 0.25, 0.15, 0.1, 0.15, 0.15]}, "POSTES": [["EJE", "Éducateur·rice de jeunes enfants", 1, 1, "DE Éducateur de jeunes enfants"], ["AP", "Auxiliaire de puériculture", 1, 1, "DE Auxiliaire de puériculture"], ["CAP AEPE", "Accompagnant·e éducatif·ve petite enfance", 2, 2, "CAP AEPE (ou qualification cat. 2)"]], "ETAPES": [["1. Candidature reçue", 2, "Gestionnaire", "Saisie au Pipeline + accusé de réception", "Candidatures"], ["2. Présélection CV", 2, "Gestionnaire / Direction", "Diplôme conforme ? Expérience ? → go / no go", "Présélection"], ["3. Entretien téléphonique", 3, "Gestionnaire", "Script 15 min (onglet Scripts) + note /5", "Entretien tél."], ["4. Entretien + mises en situation", 5, "Direction + EJE / gestionnaire", "Scorecard 12 questions notée /100", "Entretien"], ["5. Rencontre équipe / visite", 5, "Direction", "Visite + échange équipe (sans prise en charge d'enfants)", "Rencontre équipe"], ["6. Références & conformité", 7, "Gestionnaire", "2 références + diplôme + attestation d'honorabilité + aptitude", "Conformité"], ["7. Proposition envoyée", 5, "Gestionnaire", "Promesse d'embauche / contrat", "Proposition"], ["8. Embauché(e)", 0, "Gestionnaire", "DPAE + lancement de l'onboarding", "Embauche"]], "STATUTS": ["En cours", "Embauché(e)", "Vivier", "Refusé(e)", "Désisté(e)"], "SOURCES": ["Indeed", "France Travail", "Hellowork", "LinkedIn", "Cooptation", "École / organisme de formation", "Candidature spontanée", "Facebook / groupes locaux", "Agence d'intérim", "Réseau interne", "Autre"], "DIPLOMES": ["DE Éducateur de jeunes enfants", "DE Auxiliaire de puériculture", "CAP AEPE", "Titre pro Intervenant éducatif petite enfance", "Bac pro ASSP", "DE Infirmier / Puériculteur", "Autre / en cours"], "CONTRATS": ["CDI", "CDD", "Apprentissage", "Intérim"], "OUINON": ["Oui", "Non", "En attente"], "HONOR": ["Reçue", "Demandée", "Non demandée"], "VACCINS": ["OK", "En attente"], "REFS": ["OK", "Réserve", "Négatif", "Non contactées"], "ECHELLE": [[1, "Insuffisant / alerte", "Réponse dangereuse, inadaptée ou absente. Une note de 1 en Sécurité ou Bientraitance déclenche un VETO."], [2, "Fragile", "Réponse partielle, notions floues : nécessiterait un accompagnement important."], [3, "Conforme", "Réponse correcte : l'attendu de base est maîtrisé."], [4, "Solide", "Réponse structurée, exemples concrets vécus, recul sur sa pratique."], [5, "Excellent", "Réponse experte : anticipe, prévient, sait transmettre aux autres."]], "PREREQUIS": "• Copie du diplôme (vérifiée auprès de l'organisme si doute)\n• Attestation d'honorabilité (honorabilite.social.gouv.fr) — obligatoire depuis le 01/10/2025 à l'embauche puis périodiquement ; l'employeur la récupère, la vérifie et la conserve\n• Vaccinations / aptitude : à valider avec la médecine du travail\n• 2 références professionnelles contactées\n• Pièce d'identité, justificatifs administratifs, DPAE avant le 1er jour", "FICHES": {"EJE": {"titre": "ÉDUCATEUR·RICE DE JEUNES ENFANTS (EJE)", "Catégorie réglementaire": "Catégorie 1 — diplômé·e d'État : compte dans les 40 % minimum de l'effectif (décret n° 2025-304).", "Diplôme requis": "Diplôme d'État d'éducateur de jeunes enfants (DEEJE) — obligatoire.", "Rattachement": "Direction de la micro-crèche / gestionnaire. Référent·e éducatif·ve de l'équipe (1 AP + 2 CAP AEPE).", "Raison d'être du poste": "Garant·e de la qualité éducative : faire vivre le projet pédagogique, accompagner le développement de chaque enfant, soutenir l'équipe et les familles.", "Missions principales": ["Concevoir, animer et évaluer le projet pédagogique avec la direction", "Accueillir enfants et familles, conduire les familiarisations et les entretiens familles", "Proposer des activités d'éveil adaptées à l'âge et au rythme de chacun (jeu libre, motricité libre, langage, sensoriel, éveil culturel)", "Observer, rédiger des écrits professionnels, repérer les difficultés de développement et alerter", "Garantir la sécurité physique et affective ; faire appliquer les protocoles (hygiène, urgence, PAI)", "Animer la réflexion d'équipe : réunions, transmissions, analyse des pratiques, tutorat des stagiaires et apprentis", "Participer aux soins quotidiens (repas, change, sieste) : en micro-crèche, l'EJE est aussi sur le terrain", "Développer les partenariats (PMI, RPE, médiathèque…) et l'inclusion des enfants à besoins particuliers"], "Compétences techniques": ["Développement psychomoteur, affectif et cognitif 0-3 ans", "Pédagogies de référence (Pikler-Lóczy, Montessori, motricité libre) et Charte nationale pour l'accueil du jeune enfant", "Observation, écrits professionnels, conduite de projet", "Animation d'équipe et feedback constructif", "Prévention des violences éducatives ordinaires (VEO)"], "Savoir-être": "Leadership bienveillant · posture réflexive · créativité · stabilité émotionnelle · discrétion · sens de l'organisation", "Expérience souhaitée": "1 à 3 ans en EAJE (débutant·e accepté·e si stages solides). Une expérience de tutorat ou d'encadrement est un plus.", "Conditions de travail": "CDI 35 h · horaires tournants sur l'amplitude d'ouverture (ex. 7h30-19h) · travail au sol et port d'enfants · réunions d'équipe hors temps d'accueil.", "Rémunération indicative": "≈ 2 200 – 2 800 € brut/mois (repère Île-de-France, secteur privé) — à caler sur votre grille ou convention collective.", "Évolution": "Coordination pédagogique, direction de micro-crèche (conditions de qualification et d'expérience à vérifier avec la PMI).", "Annonce prête à publier": "[Nom de la crèche] recrute son·sa Éducateur·rice de jeunes enfants (H/F) — CDI 35 h — [Ville]\nRejoignez une micro-crèche de 12 berceaux à taille humaine. Vous serez la référence éducative d'une équipe de 4 : projet pédagogique, éveil, familiarisations, lien avec les familles et accompagnement de l'équipe.\nProfil : DEEJE obligatoire, sens du collectif, créativité, posture bienveillante. Jeunes diplômé·e·s bienvenu·e·s.\nNous offrons : une vraie place dans les choix pédagogiques, une équipe soudée, la formation continue, [avantages].\nRémunération : [xxx] € brut/mois selon expérience · Prise de poste : [date].\nAttestation d'honorabilité exigée à l'embauche (obligation légale)."}, "AP": {"titre": "AUXILIAIRE DE PUÉRICULTURE (AP)", "Catégorie réglementaire": "Catégorie 1 — diplômé·e d'État : compte dans les 40 % minimum et sécurise la présence obligatoire d'au moins un professionnel cat. 1.", "Diplôme requis": "Diplôme d'État d'auxiliaire de puériculture (DEAP) — obligatoire.", "Rattachement": "Direction de la micro-crèche ; travail en binôme avec l'EJE. Référent·e santé / soins de l'équipe au quotidien.", "Raison d'être du poste": "Assurer le bien-être, la santé et la sécurité de chaque enfant par des soins de qualité et une vigilance de tous les instants.", "Missions principales": ["Accueillir enfants et parents, réaliser des transmissions orales et écrites fiables", "Assurer les soins d'hygiène et de confort (change, toilette, habillage) en respectant le rythme et l'intimité de l'enfant", "Organiser les repas (biberons, diversification, régimes, allergies) et l'endormissement", "Surveiller l'état de santé : repérer les signes d'alerte, appliquer les protocoles de la structure et les PAI", "Respecter et faire respecter l'hygiène (biberonnerie, matériel, HACCP) et la sécurité des espaces", "Proposer des jeux et activités d'éveil, favoriser l'autonomie et la motricité libre", "Participer au projet pédagogique, aux réunions et à l'accueil des stagiaires"], "Compétences techniques": ["Soins de puériculture et hygiène", "Repérage des signes cliniques (fièvre, déshydratation, détresse respiratoire, réaction allergique)", "Gestes d'urgence (PSC1 / SST appréciés), protocoles et PAI", "Diététique du jeune enfant", "Développement de l'enfant 0-3 ans"], "Savoir-être": "Vigilance · douceur · rigueur · calme en situation d'urgence · sens de l'équipe · discrétion", "Expérience souhaitée": "Débutant·e accepté·e ; 1 à 2 ans en crèche, maternité ou pédiatrie appréciés.", "Conditions de travail": "CDI 35 h · horaires tournants (ouverture / fermeture) · port d'enfants, position basse · tenue professionnelle.", "Rémunération indicative": "≈ 1 850 – 2 500 € brut/mois (repère offres Île-de-France 2025-2026, secteur privé).", "Évolution": "Référent·e santé, formation EJE ou puériculture, fonctions de coordination.", "Annonce prête à publier": "[Nom de la crèche] recrute un·e Auxiliaire de puériculture diplômé·e (H/F) — CDI 35 h — [Ville]\nDans une micro-crèche de 12 enfants, vous prenez soin des tout-petits au quotidien : soins, repas, sommeil, éveil, vigilance santé et lien avec les familles, en binôme avec notre EJE.\nProfil : DEAP obligatoire, douceur, rigueur et esprit d'équipe. Débutant·e accepté·e.\nNous offrons : petite équipe, temps d'échange sur les pratiques, formation (gestes d'urgence, VEO), [avantages].\nRémunération : [xxx] € brut/mois selon expérience · Prise de poste : [date].\nAttestation d'honorabilité exigée à l'embauche (obligation légale)."}, "CAP AEPE": {"titre": "ACCOMPAGNANT·E ÉDUCATIF·VE PETITE ENFANCE (CAP AEPE)", "Catégorie réglementaire": "Catégorie 2 — qualification ou expérience : peut représenter au plus 60 % de l'effectif (seuil de 40 % de cat. 1 à respecter).", "Diplôme requis": "CAP Accompagnant éducatif petite enfance (ou qualification équivalente reconnue en cat. 2).", "Rattachement": "Direction de la micro-crèche ; travail sous la coordination éducative de l'EJE et en lien étroit avec l'AP.", "Raison d'être du poste": "Accompagner chaque enfant au quotidien dans un cadre sécurisant, chaleureux et propre, en participant à tous les temps de vie.", "Missions principales": ["Accueillir l'enfant et sa famille, assurer les transmissions", "Réaliser les soins du quotidien : repas, change, sieste, hygiène", "Animer des jeux et activités d'éveil, accompagner l'enfant vers l'autonomie", "Veiller à la sécurité physique et affective des enfants", "Assurer l'entretien et l'hygiène des locaux, jouets, linge et le réchauffage des repas (HACCP)", "Participer aux réunions d'équipe et à la mise en œuvre du projet pédagogique"], "Compétences techniques": ["Besoins fondamentaux et rythmes de l'enfant", "Hygiène, sécurité et règles HACCP", "Techniques d'animation et d'éveil", "Gestes de premiers secours appréciés"], "Savoir-être": "Bienveillance · patience · ponctualité · sens de l'équipe · adaptabilité · discrétion", "Expérience souhaitée": "Débutant·e accepté·e (stages, garde d'enfants, assistant·e maternel·le valorisés).", "Conditions de travail": "CDI 35 h · horaires tournants · port d'enfants, position basse · polyvalence entretien / soins / éveil.", "Rémunération indicative": "Base SMIC à ≈ 2 050 € brut/mois selon expérience (repère Île-de-France, secteur privé).", "Évolution": "Auxiliaire de puériculture (formation ou VAE), titre professionnel Intervenant éducatif petite enfance.", "Annonce prête à publier": "[Nom de la crèche] recrute 2 Accompagnant·e·s éducatif·ve·s petite enfance (CAP AEPE) (H/F) — CDI 35 h — [Ville]\nVous accompagnez les tout-petits dans tous les moments de la journée : accueil, repas, change, sieste, jeux et éveil, au sein d'une équipe de 4 professionnelles bienveillantes.\nProfil : CAP AEPE, patience, ponctualité, esprit d'équipe. Débutant·e accepté·e.\nNous offrons : intégration accompagnée, formation continue, perspectives d'évolution (VAE auxiliaire de puériculture), [avantages].\nRémunération : [xxx] € brut/mois · Prise de poste : [date].\nAttestation d'honorabilité exigée à l'embauche (obligation légale)."}}, "FICHE_SECTIONS": ["Catégorie réglementaire", "Diplôme requis", "Rattachement", "Raison d'être du poste", "Missions principales", "Compétences techniques", "Savoir-être", "Expérience souhaitée", "Conditions de travail", "Rémunération indicative", "Évolution", "Prérequis à l'embauche", "Annonce prête à publier"], "QUESTIONS": {"EJE": [[1, "Mise en situation", "Pendant le jeu libre, un enfant de 18 mois chute et se cogne la tête contre l'angle d'un meuble. Il pleure puis se calme. Que faites-vous, étape par étape ?", "Confie le groupe à une collègue · évalue (conscience, vomissements, bosse, comportement) · applique le protocole · surveille dans la durée · prévient les parents · trace l'incident · informe la direction · revoit l'aménagement (angle).", "Minimise (« ce n'est rien ») · laisse le groupe sans adulte · n'informe pas les parents · aucune traçabilité.", "Quels signes vous feraient appeler le 15 ?"], [1, "Expérience", "Comment intégrez-vous la sécurité dans l'aménagement de l'espace et dans la préparation d'une activité (ex. transvasement de semoule) ?", "Analyse des risques (ingestion de petits objets, allergies, hygiène) · adaptation à l'âge · nombre d'enfants par adulte · surveillance active · aménagement évolutif et motricité libre sécurisée.", "Aucune notion de risque d'étouffement · activité inadaptée à l'âge · adulte absent pendant l'activité.", "Racontez une activité que vous avez dû modifier pour raison de sécurité."], [2, "Mise en situation", "Vous entendez une collègue dire sèchement à un enfant : « Si tu continues, tu vas au coin et tu n'auras pas de dessert. » Que faites-vous sur le moment, puis après ?", "Intervient avec tact pour protéger l'enfant (prend le relais) · échange ensuite en privé · s'appuie sur la prévention des VEO et la Charte nationale · remonte à la direction si c'est répété · propose une analyse de pratiques.", "« Ce n'est pas mon rôle » · banalise · humilie la collègue devant les enfants ou les parents.", "Et si cette collègue est plus ancienne que vous dans la structure ?"], [2, "Expérience", "Racontez une situation où vous avez senti la fatigue ou l'agacement monter face à un enfant (pleurs, opposition). Comment l'avez-vous gérée ?", "Lucidité sur ses émotions · passage de relais · technique de régulation · retour réflexif · aucune violence verbale ou physique.", "Affirme ne jamais ressentir d'agacement · réponse punitive · propos dévalorisants sur l'enfant.", "Qu'avez-vous changé dans votre pratique ensuite ?"], [3, "Projet pédagogique", "Présentez les grands axes du projet pédagogique que vous aimeriez porter dans une micro-crèche de 12 enfants. Sur quelles références vous appuyez-vous ?", "Projet cohérent (jeu libre, motricité libre, langage, autonomie, inclusion, éveil culturel / nature) · références citées (Pikler-Lóczy, Montessori, Charte nationale) · déclinaison concrète · modalités d'évaluation.", "Catalogue d'activités dirigées sans sens · aucune référence · rigidité.", "Comment embarquez-vous l'équipe et les parents dans ce projet ?"], [3, "Mise en situation", "En observant un enfant de 2 ans, vous remarquez qu'il ne pointe pas du doigt, parle très peu et évite le regard. Comment procédez-vous ?", "Observations objectives, répétées et écrites · partage en équipe · échange avec la direction et le référent santé · entretien avec la famille avec tact, sans diagnostic · orientation (médecin, PMI) · adaptation de l'accueil.", "Pose un diagnostic (« il est autiste ») · en parle aux parents lors d'une transmission rapide devant d'autres · ne fait rien.", "Comment formuleriez-vous la première phrase aux parents ?"], [4, "Mise en situation", "Le soir, un parent en colère vous reproche devant d'autres parents que son enfant a été mordu pour la troisième fois. Comment réagissez-vous ?", "Accueille l'émotion · propose de s'isoler · explique la morsure (étape du développement) · présente les mesures prises (observation, aménagement) · confidentialité (ne nomme pas l'enfant mordeur) · propose un rendez-vous · informe la direction.", "Nomme l'enfant mordeur · se justifie de façon défensive · promet que cela n'arrivera plus.", "Que dites-vous aux parents de l'enfant qui mord ?"], [4, "Expérience", "Comment construisez-vous la familiarisation (adaptation) d'un bébé de 10 mois dont la maman est très anxieuse ?", "Progressivité · professionnel·le référent·e · rituels et objet transitionnel · écoute du parent · transmissions détaillées · souplesse du calendrier · réassurance.", "Adaptation standardisée et rigide · minimise l'anxiété du parent.", "Que faites-vous si la maman appelle 4 fois dans la journée ?"], [5, "Animation d'équipe", "Dans l'équipe (1 AP, 2 CAP AEPE), deux collègues sont en conflit et l'ambiance se dégrade. Que mettez-vous en place ?", "Écoute individuelle · recentrage sur l'intérêt de l'enfant · temps d'échange médiatisé · règles de fonctionnement partagées · information de la direction · suivi dans le temps.", "Prend parti · évitement · autoritarisme.", "À quel moment passez-vous le relais à la direction ?"], [5, "Expérience", "Donnez un exemple où vous avez accompagné une collègue ou une stagiaire pour faire évoluer une pratique. Comment vous y êtes-vous pris·e ?", "Méthode : observation, feedback constructif, démonstration, objectifs, valorisation, suivi.", "Pas d'exemple concret · approche descendante ou culpabilisante.", "Qu'est-ce qui a été le plus difficile ?"], [6, "Expérience", "Présentez votre parcours en EAJE (structures, âges accueillis) : qu'avez-vous appris de plus important, et pourquoi une micro-crèche aujourd'hui ?", "Parcours cohérent · recul sur ses apprentissages · compréhension des spécificités de la micro-crèche (polyvalence, petit effectif, proximité avec les familles).", "Vision floue · départs multiples non expliqués · recherche d'un poste « tranquille ».", "Pourquoi avez-vous quitté votre dernier poste ?"], [6, "Motivation", "Nous reprenons la structure : quelles seraient vos 3 priorités sur vos 90 premiers jours ? Les horaires tournants (ouverture / fermeture) vous conviennent-ils ?", "Priorités réalistes (connaître enfants et familles, cohésion d'équipe, projet pédagogique, protocoles) · disponibilité confirmée · projection dans la durée.", "Exigences incompatibles avec l'organisation · aucune projection.", "Où vous voyez-vous dans 2 ans ?"]], "AP": [[1, "Mise en situation", "À 14 h, un enfant de 15 mois a 39,2 °C, il est grognon et moins réactif que d'habitude. Que faites-vous ?", "Applique le protocole fièvre de la structure · recherche les signes de gravité (taches, somnolence, gêne respiratoire) · traitement uniquement selon protocole et autorisation · appelle les parents · trace · appelle le 15 si signe de gravité · hydratation, isolement si besoin.", "Donne un médicament hors protocole ou sans autorisation · ne prévient pas les parents · ignore les signes de gravité.", "Que vérifiez-vous avant d'administrer un antipyrétique ?"], [1, "Mise en situation", "Un enfant ayant un PAI pour allergie à l'arachide présente, après le goûter, des plaques rouges et se met à tousser. Décrivez vos actions.", "Suit le PAI (trousse d'urgence, adrénaline si prévue) · appelle le 15 · reste avec l'enfant · prévient collègues, direction et parents · trace · analyse la cause (contrôle des aliments).", "Hésite ou attend l'arrivée des parents · ne sait pas où est le PAI · ne connaît pas la trousse d'urgence.", "Comment vous assurez-vous que toute l'équipe connaît les PAI ?"], [2, "Mise en situation", "Au repas, un enfant de 20 mois refuse de manger et repousse son assiette. Votre collègue insiste en lui mettant la cuillère dans la bouche. Que faites-vous ?", "Ne force jamais (violence éducative ordinaire) · propose sans contraindre · respecte l'appétit · intervient avec tact · échange avec la collègue après · informe les parents des quantités · remonte si c'est répété.", "Approuve le forçage · « il doit finir son assiette ».", "Et si ce sont les parents qui demandent qu'il finisse ?"], [2, "Expérience", "Comment respectez-vous l'intimité et le consentement de l'enfant lors des soins (change, toilette) ? Donnez un exemple concret.", "Prévient et verbalise avant de toucher · fait participer l'enfant · change debout selon l'âge · espace dédié, jamais en public · gestes doux · vraie disponibilité relationnelle.", "Soins « à la chaîne » · aucune verbalisation.", "Que faites-vous si un enfant refuse le change ?"], [3, "Connaissances", "Quels repères de développement moteur attendez-vous entre 6 et 18 mois, et comment aménagez-vous l'espace pour favoriser la motricité libre ?", "Repères (retournement, assis seul, déplacements, marche vers 12-18 mois) · ne met pas l'enfant dans une position qu'il n'a pas acquise · tapis, structures basses · pas de transat ni de trotteur.", "Assied des bébés qui ne tiennent pas seuls · utilise des appareils contraignants.", "Comment l'expliquez-vous à des parents qui veulent « le faire marcher » ?"], [3, "Mise en situation", "Un bébé de 8 mois arrivé récemment pleure beaucoup et dort mal à la crèche. Comment l'accompagnez-vous ?", "Observe ses rythmes · échange avec les parents sur ses habitudes · référence · objet transitionnel · portage et réassurance · environnement calme · patience · transmissions.", "Le laisse pleurer seul · horaires rigides pour tous.", "Au bout de combien de temps vous inquiéteriez-vous ?"], [4, "Mise en situation", "Un parent vous demande d'empêcher son enfant de 2 ans de faire la sieste pour qu'il dorme mieux le soir. Comment répondez-vous ?", "Écoute · explique le besoin de sommeil · propose un compromis (ne pas empêcher, temps de repos, ne pas prolonger) · co-construit · trace · relaie à la direction en cas de désaccord.", "Accepte d'empêcher l'enfant de dormir · refuse sèchement sans dialogue.", "Si le parent insiste fortement ?"], [4, "Expérience", "Comment réalisez-vous en 2 minutes des transmissions utiles et rassurantes au parent le soir ? Donnez un exemple.", "Factuel (repas, sieste, change, santé) + vécu de l'enfant (moment fort) · positif sans mentir · information sensible en privé · confidentialité.", "Transmissions vides (« ça a été ») · jugements · parle des autres enfants.", "Comment annoncez-vous un petit accident (chute, morsure) ?"], [5, "Mise en situation", "À l'ouverture, une collègue appelle : elle sera absente. Les enfants arrivent. Que faites-vous ?", "Vérifie immédiatement le taux d'encadrement · prévient la direction / le gestionnaire · réorganise · cherche un remplacement · ne dépasse jamais le ratio autorisé · priorité à la sécurité.", "Accepte de dépasser le taux sans alerter · panique · laisse un adulte seul avec trop d'enfants.", "Que dites-vous aux parents qui arrivent ?"], [5, "Expérience", "Racontez un désaccord avec une collègue ou une responsable sur une pratique. Comment s'est-il résolu ?", "Communication directe et respectueuse · arguments centrés sur l'enfant · accepte le compromis · en tire un apprentissage.", "Rumeurs · conflit non résolu · critique systématique des anciens employeurs.", "Qu'auriez-vous fait différemment ?"], [6, "Expérience", "Présentez votre parcours (crèche, maternité, pédiatrie…) : qu'est-ce qui vous attire dans une micro-crèche de 12 enfants ?", "Parcours cohérent · goût de la polyvalence et du travail en petite équipe · vraie motivation pour l'accueil collectif.", "Motivation uniquement pratique (proximité, horaires) · méconnaissance du collectif.", "Quelle a été votre plus grande fierté professionnelle ?"], [6, "Motivation", "Quelles sont vos disponibilités et contraintes (horaires tournants, trajet, date de démarrage) ? Comment voyez-vous votre évolution ?", "Disponibilités compatibles · trajet raisonnable · projet réaliste (référent·e santé, formation).", "Contraintes incompatibles · aucune projection.", "Quelle formation aimeriez-vous suivre dans l'année ?"]], "CAP AEPE": [[1, "Mise en situation", "En fin de journée, une personne que vous ne connaissez pas se présente pour récupérer un enfant en disant être sa tante. Que faites-vous ?", "Ne confie jamais l'enfant à une personne non autorisée · vérifie la liste des personnes autorisées et la pièce d'identité · appelle les parents · informe la direction · reste courtois·e.", "Confie l'enfant « parce qu'elle a l'air de le connaître ».", "Et si l'enfant court vers elle en souriant ?"], [1, "Mise en situation", "Pendant que vous préparez le goûter, un enfant de 2 ans met une petite perle dans sa bouche et commence à s'étouffer. Que faites-vous ?", "Gestes d'urgence adaptés à l'âge (claques dans le dos, compressions) · alerte une collègue · appel au 15 / 112 · protocole · prévention : petits objets hors de portée.", "Ne connaît aucun geste · va chercher l'objet avec les doigts à l'aveugle · panique.", "Avez-vous déjà suivi une formation aux gestes de premiers secours ?"], [2, "Mise en situation", "Un enfant de 2 ans et demi tape les autres et vous mord pendant un jeu. Comment réagissez-vous ?", "Protège l'enfant tapé · pose une limite calmement et clairement · met des mots sur l'émotion · propose une alternative · aucune punition humiliante · observe la fréquence et en parle en équipe.", "Le met au coin longtemps · crie · « le mordre pour qu'il comprenne ».", "Que dites-vous à ses parents le soir ?"], [2, "Connaissances", "Qu'est-ce que la bientraitance pour vous ? Donnez un exemple concret de votre pratique et un exemple de violence éducative ordinaire à éviter.", "Respect des besoins, du rythme et de la dignité · exemples (verbaliser, laisser le temps) · VEO citées (cris, menaces, forcer à manger, moqueries, étiquettes).", "Ne connaît pas la notion · banalise certaines VEO.", "Que faites-vous si vous voyez une collègue crier sur un enfant ?"], [3, "Mise en situation", "Proposez une activité d'éveil pour 4 enfants de 18 à 30 mois : objectif, matériel, déroulé, rôle de l'adulte.", "Activité adaptée (transvasement, pâte à sel, parcours moteur, lecture) · objectif (sensoriel, moteur, langage) · sécurité · participation libre · adulte disponible et observateur.", "Activité dangereuse ou très dirigée · obligation de participer · production « pour les parents ».", "Et si un enfant ne veut pas participer ?"], [3, "Connaissances", "Comment accompagnez-vous un enfant vers l'autonomie (repas, habillage, propreté) sans le brusquer ?", "Respect du rythme de chacun · encouragements · matériel adapté · lien avec la famille · aucune pression sur la propreté.", "« Il doit être propre à 2 ans » · pression ou moqueries.", "Comment réagissez-vous à un « accident » de propreté ?"], [4, "Mise en situation", "Le matin, un papa pressé part sans dire au revoir à son enfant qui pleure. Que faites-vous avec l'enfant, puis avec le papa ?", "Accueille et rassure l'enfant · verbalise · en reparle au papa avec bienveillance (importance d'une séparation ritualisée) · sans jugement.", "Juge le parent · « il vaut mieux partir vite ».", "Comment formulez-vous votre remarque au papa ?"], [4, "Expérience", "Un parent vous pose une question sur la santé ou le comportement de son enfant et vous ne savez pas répondre. Comment faites-vous ?", "Reconnaît ses limites · n'improvise pas · relaie à l'EJE, à l'AP ou à la direction · propose un rendez-vous.", "Donne des conseils médicaux · invente une réponse.", "Donnez un exemple réel."], [5, "Mise en situation", "Ce jour-là, vous êtes en charge de l'entretien des locaux et du réchauffage des repas, mais le groupe a besoin de vous. Comment vous organisez-vous ?", "Priorité à la sécurité des enfants · communique avec l'équipe · respecte l'HACCP (températures, traçabilité) · s'organise avec méthode.", "Néglige l'hygiène · laisse les enfants sans surveillance.", "Quelles règles HACCP connaissez-vous ?"], [5, "Expérience", "Racontez un moment où vous avez dû vous adapter rapidement à un changement (planning, collègue absente). Qu'avez-vous fait ?", "Flexibilité · communication · esprit d'équipe · reste centré·e sur les enfants.", "Rigidité · plainte sans solution.", "Comment réagissez-vous à un changement de planning la veille ?"], [6, "Expérience", "Parlez-nous de vos expériences auprès de jeunes enfants (crèche, stage, garde, assistant·e maternel·le) : qu'avez-vous préféré, et trouvé difficile ?", "Expériences concrètes · recul · difficultés assumées et dépassées.", "Aucune expérience réelle décrite · discours générique.", "Qu'est-ce qu'une bonne journée pour vous ?"], [6, "Motivation", "Pourquoi ce métier et pourquoi notre micro-crèche ? Envisagez-vous d'évoluer (ex. auxiliaire de puériculture par VAE ou formation) ?", "Motivation authentique pour l'enfant · intérêt pour l'évolution (CAP → AP : un atout face aux nouvelles exigences de qualification).", "Choix par défaut · aucune projection.", "Seriez-vous prêt·e à suivre une formation en cours d'année ?"]]}, "SCRIPT_TEL": [["Pouvez-vous me confirmer votre diplôme exact et son année d'obtention ?", "Vérifier l'éligibilité au poste (cat. 1 / cat. 2)", "Oui", "Diplôme conforme au poste, copie transmissible rapidement."], ["Depuis combien de temps travaillez-vous auprès des 0-3 ans, et dans quels types de structures ?", "Qualifier l'expérience", "Non", "Expériences concrètes et datées (structures, âges, durées)."], ["Nos horaires tournent sur l'amplitude d'ouverture (ex. 7h30-19h). Est-ce compatible avec votre organisation ?", "Disponibilité", "Oui", "Oui clair, sans contrainte bloquante."], ["À quelle date pourriez-vous démarrer ? Avez-vous un préavis ?", "Planification", "Non", "Date compatible avec la prise de poste cible."], ["Combien de temps de trajet auriez-vous, et comment viendriez-vous ?", "Risque d'absentéisme / turnover", "Non", "Trajet raisonnable (idéalement \u003c 45 min), solution fiable."], ["Quelles sont vos prétentions salariales (brut mensuel) ?", "Adéquation budget", "Non", "Dans la fourchette du poste (voir Fiches de poste)."], ["En une minute : pourquoi ce poste, et pourquoi une micro-crèche ?", "Motivation", "Non", "Motivation centrée sur l'enfant et le travail en petite équipe."], ["Nous demandons une attestation d'honorabilité à l'embauche (obligation légale). Est-ce que cela vous pose une difficulté ?", "Conformité", "Oui", "Accord sans hésitation."]], "MODELES": [["Convocation à l'entretien", "Objet : Votre candidature — poste de [poste] à [crèche]\n\nBonjour [Prénom],\n\nMerci pour notre échange téléphonique. Je vous propose un entretien le [date] à [heure] à [adresse] (durée : 1 h environ, dont quelques mises en situation professionnelles).\nMerci d'apporter : CV, copie de votre diplôme et, si possible, les coordonnées de 2 références.\n\nPouvez-vous me confirmer votre présence ?\n\nBien cordialement,\n[Signature]"], ["Demande des pièces de conformité", "Objet : Finalisation de votre recrutement — pièces à fournir\n\nBonjour [Prénom],\n\nNous sommes heureux de poursuivre avec vous. Pour finaliser, merci de nous transmettre :\n• la copie de votre diplôme ;\n• votre attestation d'honorabilité, à demander sur honorabilite.social.gouv.fr (obligatoire pour exercer en crèche) ;\n• vos justificatifs administratifs (pièce d'identité, carte Vitale, RIB).\nNous contacterons également les références que vous nous avez indiquées.\n\nBien cordialement,\n[Signature]"], ["Réponse négative après entretien", "Objet : Votre candidature — [poste]\n\nBonjour [Prénom],\n\nMerci pour le temps que vous nous avez consacré lors de notre entretien. Après réflexion, nous avons retenu un profil plus proche de nos besoins actuels.\n[Option : Votre candidature a retenu notre attention ; avec votre accord, nous la conservons pour de futurs postes.]\n\nNous vous souhaitons pleine réussite.\nBien cordialement,\n[Signature]"], ["Proposition d'embauche", "Objet : Proposition d'embauche — [poste] à [crèche]\n\nBonjour [Prénom],\n\nNous avons le plaisir de vous proposer le poste de [poste] :\n• Contrat : [CDI] — [35 h] hebdomadaires\n• Rémunération : [xxx] € brut mensuel\n• Prise de poste : [date]\n• Période d'essai : [durée]\n\nCette proposition est valable jusqu'au [date] et reste soumise à la réception de votre attestation d'honorabilité et de votre diplôme.\n\nAu plaisir de vous accueillir dans l'équipe,\n[Signature]"]], "ONBOARDING": [["Avant J1", "Promesse d'embauche / contrat signé"], ["Avant J1", "DPAE effectuée"], ["Avant J1", "Attestation d'honorabilité vérifiée, archivée, date de renouvellement notée"], ["Avant J1", "Copie du diplôme archivée au dossier du personnel"], ["Avant J1", "Mutuelle / prévoyance, justificatifs administratifs"], ["Avant J1", "Visite d'information et de prévention (médecine du travail) planifiée"], ["Avant J1", "Planning des 4 premières semaines remis"], ["J1", "Accueil, visite des locaux, présentation de l'équipe"], ["J1", "Remise du projet pédagogique, du règlement de fonctionnement, du livret d'accueil"], ["Semaine 1", "Protocoles lus et signés (urgence, PAI, hygiène, sorties, sécurité)"], ["Semaine 1", "Binôme / tutorat avec un·e professionnel·le expérimenté·e"], ["Semaine 2", "Présentation aux familles des enfants dont il·elle est référent·e"], ["J+30", "Point « rapport d'étonnement » à 1 mois"], ["Fin d'essai", "Bilan de fin de période d'essai"], ["Fin d'essai", "Plan de formation (gestes d'urgence, prévention des VEO…)"]], "REGLEMENTAIRE": ["Décret n° 2025-304 du 1er avril 2025 — dispositions micro-crèches applicables au 1er septembre 2026 :", "• au moins un professionnel diplômé d'État de catégorie 1 (auxiliaire de puériculture, EJE, infirmier, psychomotricien) dans l'é   if (t.id === "cmpC") { ui.cmpC = t.value; return render(true); }
  if (t.id && t.id.startsWith("e_")) { const c = clone(find(ui.sel)); c.eval = {...(c.eval || {notes: Array(12).fill(null)}), [t.id.slice(2)]: t.value}; return persist(c, 300); }
  if (ds.plan) { cfg.plan[ds.plan] = {...(cfg.plan[ds.plan] || {}), [ds.k]: t.value}; return saveCfg(); }
  if (ds.cr) { const v = ["etp","cat1","cat2"].includes(ds.k) ? +t.value || 0 : t.value; cfg.creches[+ds.cr][ds.k] = v; return saveCfg(); }
  if (ds.w) { cfg.poids[ds.w][+ds.i] = (+t.value || 0) / 100; return saveCfg(); }
  if (ds.sla) { cfg.sla[+ds.sla] = +t.value || 0; return saveCfg(); }
  if (t.id === "sGo") { cfg.seuilGo = +t.value || 75; return saveCfg(); }
  if (t.id === "sApp") { cfg.seuilApp = +t.value || 60; return saveCfg(); }
});
$("#fCreche").addEventListener("change", e => { ui.creche = e.target.value; render(true); });
$("#newBtn").addEventListener("click", () => openDrawer(null));
/* glisser-déposer sur le tableau des étapes */
let dragId = null;
document.addEventListener("dragstart", e => { const c = e.target.closest?.(".card"); if (c) { dragId = c.dataset.id; e.dataTransfer.effectAllowed = "move"; e.dataTransfer.setData("text/plain", dragId); } });
document.addEventListener("dragover", e => { const col = e.target.closest?.("[data-drop]"); if (col && dragId) { e.preventDefault(); document.querySelectorAll(".col.over").forEach(x => x !== col && x.classList.remove("over")); col.classList.add("over"); } });
document.addEventListener("drop", e => { const col = e.target.closest?.("[data-drop]"); if (!col || !dragId) return; e.preventDefault(); const c = find(dragId); dragId = null;
  if (c) move(c, +col.dataset.drop - c.etape); });
document.addEventListener("dragend", () => { dragId = null; document.querySelectorAll(".col.over").forEach(x => x.classList.remove("over")); });

/* ---------- démarrage : base de données partagée ---------- */
route();
(async () => {
  const timer = setTimeout(() => { if (mode === "init") { mode = "local"; render(); } }, 10000);
  try { db = await window.claude?.use?.("db"); } catch (e) { db = null; }
  if (!db) { clearTimeout(timer); mode = "local"; render(); return; }
  db.collection("candidats").onSnapshot(s => { cands = s.docs.map(d => ({...clone(d.data()), id: d.id})); if (!s.metadata.fromCache) clearTimeout(timer);
    if (mode !== "db") { mode = "db"; if (!exMode() && ui.sel && !find(ui.sel)) ui.sel = ""; } render(); }, err => { clearTimeout(timer); if (mode === "init") mode = "local"; onErr(err); render(); });
  db.doc("config/main").onSnapshot(s => { if (s.exists) { const d = clone(s.data()); cfg = {...clone(DEF), ...d, creches: (d.creches || DEF.creches).map((c, i) => ({...DEF.creches[i], ...c})), poids: {...clone(DEF.poids), ...(d.poids || {})}}; render(); } }, () => {});
})();
}
</script>
